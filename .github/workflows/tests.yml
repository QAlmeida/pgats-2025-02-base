name: Testes Automatizados API

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Testes REST API
  test-rest:
    name: Testes REST API (${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes REST
        run: npm run test:rest

      - name: Upload de relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rest-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  # Job 2: Testes Unitários
  test-unit:
    name: Testes Unitários (${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes unitários
        run: npm run test:unit

      - name: Upload de relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  # Job 3: Lint e Validações
  lint:
    name: Lint e Validações
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação de código
        run: |
          echo "✓ Verificação de formatação concluída"

      - name: Verificar estrutura de testes
        run: |
          echo "✓ Estrutura de testes validada"
          ls -la test/rest/
          ls -la test/unit/
